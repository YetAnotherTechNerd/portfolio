name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5 # 👈 Triggers whenever you push changes to your v5 branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetches full history so Quartz can compute page creation dates

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build # 👈 Compiles your notes into the /public output directory

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public # 👈 Points directly to your built HTML portfolio content

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
